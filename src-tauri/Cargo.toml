[package]
name = "hush"
version = "0.1.0"
description = "Hush — dictation, file transcription and meeting notes"
authors = ["Hush"]
edition = "2024"

[lib]
name = "hush_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
which = "8"
tempfile = "3"
parking_lot = "0.12"
once_cell = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"

# audio
cpal = "0.18"
rubato = "0.16"
hound = "3.5"
symphonia = { version = "0.5", features = ["all"] }
ringbuf = "0.4"
earshot = "1.2"

# local speech-to-text
transcribe-cpp = { version = "=0.4.0", default-features = false, features = ["metal"] }

# dictation
handy-keys = "0.3.4"
enigo = "0.6"
strsim = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.29", default-features = false, features = ["core_audio", "av", "ns", "cf", "dispatch", "blocks", "macos_15_0"] }
tauri-nspanel = "2.1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
