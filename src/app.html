<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hush</title>
    <script>
      // Apply the theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("hush-theme") || "system";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (location.pathname.startsWith("/overlay")) document.documentElement.classList.add("overlay");
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="false">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
