<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hush</title>
    <script>
      // Electrobun serves the app as views://mainview/index.html; the router expects "/" (or "/overlay" in
      // the dictation overlay window, which is told apart by the globals injected before this runs).
      if (location.pathname === "/index.html") {
        var to = window.__hush && window.__hush.window === "overlay" ? "/overlay" : "/";
        history.replaceState(history.state, "", to + location.search + location.hash);
      }
    </script>
    <script>
      // Apply the theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("hush-theme") || "system";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (location.pathname.startsWith("/overlay")) document.documentElement.classList.add("overlay");
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="false">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
