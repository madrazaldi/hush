[package]
name = "hush-native"
version = "0.1.0"
description = "Hush native sidecar: audio capture, on-device speech-to-text, global hotkeys and text insertion"
authors = ["Hush"]
edition = "2024"
publish = false

[lib]
name = "hush_native"
path = "src/lib.rs"

[[bin]]
name = "hush-native"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"

# audio capture
cpal = "0.18"
rubato = "5"
ringbuf = "0.5"

# local speech-to-text
transcribe-cpp = { version = "=0.4.0", default-features = false, features = ["metal"] }

# global hotkeys
handy-keys = "0.3.4"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.29", default-features = false, features = ["core_audio", "av", "ns", "cf", "dispatch", "blocks", "macos_15_0"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
