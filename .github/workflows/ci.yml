name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these checks before it builds anything.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (svelte-check, tsc, bun test, UI build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The `prepare` hook projects the Electrobun SDK into .hutch/devkit.
      - run: bun install --frozen-lockfile
      - name: Check versions agree
        run: bun scripts/version.ts
      # svelte-check (0 errors, 0 warnings) for the UI, then tsc for the Bun side.
      - run: bun run check
      - run: bun run test
      - run: bun run build:ui

  native:
    name: Native helper (fmt, clippy, tests)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native/hush-native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/hush-native
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked
