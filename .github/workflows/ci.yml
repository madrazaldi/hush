name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these checks before it builds anything.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (svelte-check, tsc, bun test, UI build)
    # The audio tests shell out to /usr/bin/afconvert.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The `prepare` hook projects the Electrobun SDK into .hutch/devkit.
      - run: bun install --frozen-lockfile
      - name: Check versions agree
        run: bun scripts/version.ts
      # svelte-check (0 errors, 0 warnings) for the UI, then tsc for the Bun side.
      - run: bun run check
      - run: bun run test
      - run: bun run build:ui

  native:
    name: Native helper (swift-format, build, tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # transcribe.cpp (ggml + Metal) takes minutes to build; reuse it until the pinned version changes.
      - uses: actions/cache@v4
        with:
          path: native/hush-native/vendor
          key: transcribe-${{ runner.os }}-${{ hashFiles('scripts/build-native.ts') }}
      - name: Build transcribe.cpp
        run: bun scripts/build-native.ts --deps-only
      - name: swift format
        working-directory: native/hush-native
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: swift build
        working-directory: native/hush-native
        run: swift build -Xswiftc -warnings-as-errors
      - name: swift test
        working-directory: native/hush-native
        run: swift test
