version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      bun:
        patterns: ["*"]
    ignore:
      # SvelteKit 3 declares a typescript ^6 peer dependency.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
